# Демо-витрина на GitHub Pages.
#
# На Pages нет сервера, поэтому публикуется статический экспорт: hero, арсенал,
# карточки товаров и корзина. Оформления заказа и админки там нет — они живут
# в маршрутах *.server.tsx, которые демо-сборка не видит.
#
# Контент берётся из content/demo.json (обновляется командой npm run content:export).

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют между собой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Проект-страница живёт в подкаталоге с именем репозитория.
      # Для своего домена очистить обе переменные.
      NEXT_PUBLIC_BASE_PATH: /mangal
      NEXT_PUBLIC_SITE_URL: https://cerutisi.github.io/mangal
      DATABASE_URL: file:mangal.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Базы в репозитории нет: собираем её из снимка контента на лету
      - run: npm run db:migrate
      - run: npm run db:seed

      - run: npm run build:demo

      # Иначе Pages может спрятать каталог _next как служебный
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
